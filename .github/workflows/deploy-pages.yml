name: Publier le portail Jedi (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Déployer le site public
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Préparer uniquement les fichiers publics
        run: |
          mkdir -p _site
          cp index.html styles.css app.js data.js config.js favicon.svg .nojekyll _site/
          test -f _site/index.html

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'archive du site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
